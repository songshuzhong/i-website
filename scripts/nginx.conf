
user  root;
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    gzip  on;
    gzip_comp_level 9; 
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;  

    client_body_buffer_size 16k;  # 缓存到内存中的大小阈值  
    client_max_body_size 2m;     # 最大请求体大小 
    
     server {
        listen       80;
        server_name  www.i-renderer.love;
        add_header 'Cache-Control' 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
        expires off;
        #charset koi8-r;
        #access_log  logs/host.access.log  main;
        location /api {
            proxy_pass http://www.i-renderer.love:9000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location ^~ /avatars {  
            alias /home/lighthouse/github/i-static/avatars;  
            try_files $uri $uri/ =404;  
            expires 1y;  
            add_header Cache-Control public;  
        }
        location ^~ /images {
            alias /home/lighthouse/github/i-static/images;
            try_files $uri $uri/ =404;
            expires 1y;
            add_header Cache-Control public;
        }
        location ^~ /logo {
            alias /home/lighthouse/github/i-static/logo;
            try_files $uri $uri/ =404;
            expires 1y;
            add_header Cache-Control public;
        }
        location ^~ /javascript {
            alias /home/lighthouse/github/i-static/js;
            try_files $uri $uri/ =404;
            expires 1y;
            add_header Cache-Control public;
        }
        location ~* \.(json|txt|ttf|js|css|png|jpg|jpeg|gif|ico)$ {  
            expires 1y;
            add_header Cache-Control "public, max-age=31536000";   
            add_header ETag "";  
            add_header If-None-Match ""; 
           # add_header Cache-Control public;  
        }
        location /playground.html {
          root html/i-website;
          index playground.html;
          try_files $uri $uri/ /playground.html;
        }
        location / {
            root html/i-website;
            index home.html;
            try_files $uri $uri/ /home.html;
        } 
        location /home {
            root   html/i-website;
            index  home.html;
            try_files $uri $uri/ /home.html;
        }
        location /login {
            root html/i-website;
            index login.html;
            try_files $uri $uri/ /login.html;
        }
        location /website {
            root html/i-website;
            index website.html;
            try_files $uri $uri/ /website.html; 
        }
        location /editing {
            root   html/i-website;
            index  editing.html;
            try_files $uri $uri/ /editing.html;
        }
        location /mobile {
            root html/i-website;
            index mobile.html;
            try_files $uri $uri/ /mobile.html;
        }
        location /report {
          root html/i-website;
          index report.html;
          try_files $uri $uri/ /report.html;
        }
        # proxy the PHP scripts to Apache listening on 127.0.0.1:80
        #
        #location ~ \.php$ {
        #    proxy_pass   http://127.0.0.1;
        #}

        # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
        #
        #location ~ \.php$ {
        #    root           html;
        #    fastcgi_pass   127.0.0.1:9000;
        #    fastcgi_index  index.php;
        #    fastcgi_param  SCRIPT_FILENAME  /scripts$fastcgi_script_name;
        #    include        fastcgi_params;
        #}

        # deny access to .htaccess files, if Apache's document root
        # concurs with nginx's one
        #
        #location ~ /\.ht {
        #    deny  all;
        #}
    }


